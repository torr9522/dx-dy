title = "Private Subscription Manager release scan"
[extend]
useDefault = true

[[rules]]
id = "node-uuid"
description = "Potential non-synthetic node UUID"
regex = '''(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b'''
[[rules.allowlists]]
description = "Only explicitly committed synthetic test UUIDs"
regexTarget = "match"
regexes = [
  '''11111111-1111-4111-8111-111111111111''',
  '''22222222-2222-4222-f222-222222222222''',
  '''33333333-3333-4333-f333-333333333333''',
  '''AAAAAAAA-AAAA-4AAA-FAAA-AAAAAAAAAAAA''',
]
