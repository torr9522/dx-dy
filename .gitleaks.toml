title = "Private Subscription Manager release scan"
[extend]
useDefault = true

[[rules]]
id = "node-uuid"
description = "Potential non-synthetic node UUID"
regex = '''(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b'''
[[rules.allowlists]]
description = "Only the committed synthetic fixture UUID"
regexTarget = "match"
regexes = ['''11111111-1111-4111-8111-111111111111''']
