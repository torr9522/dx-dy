name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  native:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
          cache: pnpm
      - name: Validate direct version tag
        run: node scripts/ci-ref-check.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build native artifact
        env:
          RELEASE_GIT_COMMIT: ${{ github.sha }}
        run: node scripts/build-native-artifact.mjs "${{ matrix.arch }}"
      - name: Verify bundled runtime and native addon
        run: node scripts/native-release-check.mjs "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: dist/native/dx-dy-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
          cache: pnpm
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: shellcheck -x install.sh ops/dx-dy
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/native
          merge-multiple: true
      - run: node scripts/native-release-check.mjs
      - name: Prepare native release assets
        env:
          RELEASE_GIT_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node scripts/release-manifest.mjs
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/release/* --verify-tag --generate-notes --title "dx-dy ${GITHUB_REF_NAME#v}"
