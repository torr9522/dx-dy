services:
  app:
    build: .
    image: dx-dy:0.1.8
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - app-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  app-data:
